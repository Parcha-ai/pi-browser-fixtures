<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Account</title><style>:root{--ink:#0b2a33;--ink2:#123c47;--teal:#0e6b6b;--water:#19a7a0;--mist:#e4f3f1;--accent:#f0a23a;--paper:#f5f8f7;--line:#d6e2e0;--muted:#5a7076}*{box-sizing:border-box}html{background:var(--paper);-webkit-text-size-adjust:100%}body{font-family:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;color:var(--ink);line-height:1.5;font-size:16px;max-width:40rem;margin:40px auto;padding:0 28px 32px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px rgba(11,42,51,.06)}[hidden]{display:none!important}#fixture-banner{margin:0 -28px 26px;background:var(--ink);color:#cfe6e3;font-size:12px;letter-spacing:.04em;padding:8px 28px;font-weight:600}#fixture-banner::before{content:"";display:inline-block;width:7px;height:7px;background:var(--accent);margin-right:8px;vertical-align:middle}h1{margin:0 0 16px;font-size:32px;line-height:1.15;letter-spacing:-.02em}p{margin:0 0 14px}a{color:var(--teal);font-weight:600}label{display:block;font-weight:600;font-size:14px;margin:0 0 14px}input{display:block;width:100%;margin-top:6px;font:inherit;padding:12px 14px;border:1px solid #b9cbc8;background:#fff;color:var(--ink)}input[type=file]{padding:10px;margin-top:0}input:focus{outline:3px solid rgba(25,167,160,.35);border-color:var(--water)}button{font:inherit;font-weight:700;padding:12px 22px;border:1px solid transparent;background:var(--ink);color:#fff;cursor:pointer}button:hover{background:var(--ink2)}form button{margin-top:4px}code{display:block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;background:var(--mist);border:1px dashed var(--water);padding:10px 14px;margin:0 0 18px;word-break:break-all}#who,#status,#chosen,#error,#enrolled{padding:10px 14px;background:var(--paper);border:1px solid var(--line);margin:18px 0 0;word-break:break-word}#chosen:empty{display:none}#error{border-color:#e3b3aa;background:#fdf1ef;color:#a3321f;font-weight:600}#enrolled{border-color:var(--teal);background:var(--mist);font-weight:600}#download{display:inline-block;background:var(--ink);color:#fff;padding:12px 22px;text-decoration:none;font-weight:700}#download:hover{background:var(--ink2)}@media (max-width:640px){body{margin:0;border:0;box-shadow:none;padding:0 20px 28px}#fixture-banner{margin:0 -20px 22px;padding:8px 20px}h1{font-size:28px}}</style></head>
<body>
<p id="fixture-banner" role="note">pi-browser test fixture: do not enter real credentials</p>
<h1>Account</h1>
<p id="who">Not signed in. <a href="login.html">Sign in</a> first.</p>
</body></html>
