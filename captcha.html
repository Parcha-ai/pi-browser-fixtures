<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prove you are human</title><style>body{font-family:system-ui,sans-serif;max-width:40rem;margin:1rem auto;padding:0 1rem}#fixture-banner{background:#fde68a;border:1px solid #b45309;padding:.5rem;font-weight:600}label{display:block;margin:.5rem 0}</style></head>
<body>
<p id="fixture-banner" role="note">pi-browser test fixture: do not enter real credentials</p>
<h1>Prove you are human</h1>
<button id="human" type="button">I am not a robot</button>
<p id="status">Waiting for a person.</p>
<script>
document.getElementById("human").addEventListener("click", (event) => {
  document.getElementById("status").textContent = event.isTrusted ? "Thanks, you are human." : "Only a person can press this.";
});
</script>
</body></html>
